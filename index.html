<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه مدیریت شارژ ساختمان</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); margin-bottom: 20px; }
        h1, h2 { margin-top: 0; color: #0f172a; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        button.outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        button.outline:hover { background: #eff6ff; }
        .hidden { display: none !important; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: bold; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-paid { background: #dcfce7; color: #166534; }
        .charge-item { border-bottom: 1px solid var(--border); padding: 16px 0; }
        .charge-item:last-child { border-bottom: none; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* استایل جدید برای تغییر رمز */
        details.password-section { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 20px; background: #fff; }
        details.password-section summary { cursor: pointer; font-weight: bold; color: var(--primary); padding: 5px; outline: none; }
        .status-msg { margin-top: 10px; font-size: 0.85rem; font-weight: bold; min-height: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <!-- فرم لاگین -->
        <div id="login-card" class="card">
            <h1>ورود به سامانه شارژ ساختمان</h1>
            <div class="form-group">
                <label for="login-user">شماره واحد (یا نام کاربری مدیر)</label>
                <input type="text" id="login-user" placeholder="مثلاً: 1 یا admin">
            </div>
            <div class="form-group">
                <label for="login-pass">رمز عبور</label>
                <input type="password" id="login-pass">
            </div>
            <button onclick="handleLogin()">ورود</button>
        </div>

        <!-- داشبورد اصلی -->
        <div id="dashboard" class="hidden">
            <div class="header-bar">
                <div>
                    <h2 id="user-display-title" style="margin-bottom: 5px;">داشبورد</h2>
                    <span id="user-role-badge" class="badge"></span>
                </div>
                <div style="width: auto;">
                    <button class="outline" style="padding: 6px 16px;" onclick="handleLogout()">خروج</button>
                </div>
            </div>

            <!-- بخش تغییر رمز عبور (جدید) -->
            <details id="password-details" class="password-section">
                <summary>🔐 تغییر رمز عبور</summary>
                <div style="padding-top: 15px;">
                    <div class="form-group">
                        <label for="current-password">رمز عبور فعلی:</label>
                        <input type="password" id="current-password" autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="new-password">رمز عبور جدید (حداقل ۸ کاراکتر):</label>
                        <input type="password" id="new-password" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">تکرار رمز عبور جدید:</label>
                        <input type="password" id="confirm-password" autocomplete="new-password">
                    </div>
                    <button id="change-password-button" onclick="handleChangePassword()">بروزرسانی رمز عبور</button>
                    <div id="password-change-status" class="status-msg" aria-live="polite"></div>
                </div>
            </details>

            <!-- بخش ثبت شارژ مخصوص مدیر -->
            <div id="admin-create-charge" class="card hidden">
                <h2>ثبت شارژ جدید برای واحدها</h2>
                <div class="form-group">
                    <label for="new-charge-unit">شماره واحد (۱ تا ۱۶):</label>
                    <input type="number" id="new-charge-unit" min="1" max="16" placeholder="شماره واحد">
                </div>
                <div class="form-group">
                    <label for="new-charge-month">نام دوره / ماه:</label>
                    <input type="text" id="new-charge-month" placeholder="مثلاً: آبان ۱۴۰۳">
                </div>
                <div class="form-group">
                    <label for="new-charge-amount">مبلغ شارژ (تومان):</label>
                    <input type="number" id="new-charge-amount" placeholder="مثلاً: 350000">
                </div>
                <div class="form-group">
                    <label for="new-charge-desc">توضیحات (اختیاری):</label>
                    <textarea id="new-charge-desc" rows="2" placeholder="توضیحات لازم..."></textarea>
                </div>
                <button onclick="createCharge()">ثبت صورتحساب</button>
            </div>

            <!-- لیست شارژها -->
            <div class="card">
                <h2>لیست صورتحساب‌ها</h2>
                <div id="charges-container">در حال دریافت اطلاعات...</div>
            </div>
        </div>
    </div>

    <script>
        // تنظیمات اتصال
        const SUPABASE_URL = "https://virkprhykbvcawaryrvp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_V3f8YRCSNQNhH7yrFhaLCA_c-lm6Flj"; 
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let isAdmin = false;

        window.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                setupUserSession(session.user);
            }
        });

        async function handleLogin() {
            const userInput = document.getElementById("login-user").value.trim().toLowerCase();
            const password = document.getElementById("login-pass").value;

            if (!userInput || !password) {
                alert("لطفاً نام کاربری و رمز عبور را وارد کنید.");
                return;
            }

            let email = "";
            if (userInput === "admin") {
                email = "admin@sakhteman.local";
            } else {
                const unitNumber = userInput.replace(/[^0-9]/g, "");
                email = "unit" + unitNumber + "@sakhteman.local";
            }

            const { data, error } = await db.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert("نام کاربری یا رمز عبور اشتباه است: " + error.message);
                return;
            }

            setupUserSession(data.user);
        }

        async function setupUserSession(user) {
            currentUser = user;
            isAdmin = user.email === "admin@sakhteman.local";

            document.getElementById("login-card").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");

            const roleBadge = document.getElementById("user-role-badge");
            const title = document.getElementById("user-display-title");

            if (isAdmin) {
                title.textContent = "پنل مدیریت ساختمان";
                roleBadge.textContent = "مدیر";
                roleBadge.className = "badge badge-paid";
                document.getElementById("admin-create-charge").classList.remove("hidden");
            } else {
                const unitNumber = user.email.replace(/[^0-9]/g, "");
                title.textContent = "واحد شماره " + unitNumber;
                roleBadge.textContent = "ساکن";
                roleBadge.className = "badge";
                roleBadge.style.background = "#e0e7ff";
                roleBadge.style.color = "#3730a3";
                document.getElementById("admin-create-charge").classList.add("hidden");
            }

            loadCharges();
        }

        async function handleChangePassword() {
            const currentPass = document.getElementById("current-password").value;
            const newPass = document.getElementById("new-password").value;
            const confirmPass = document.getElementById("confirm-password").value;
            const status = document.getElementById("password-change-status");
            const btn = document.getElementById("change-password-button");

            status.textContent = "";
            status.style.color = "var(--text)";

            if (!currentPass || !newPass || !confirmPass) {
                status.textContent = "لطفاً تمام فیلدها را پر کنید.";
                status.style.color = "var(--danger)";
                return;
            }

            if (newPass.length < 8) {
                status.textContent = "رمز جدید باید حداقل ۸ کاراکتر باشد.";
                status.style.color = "var(--danger)";
                return;
            }

            if (newPass !== confirmPass) {
                status.textContent = "رمز جدید با تکرار آن مطابقت ندارد.";
                status.style.color = "var(--danger)";
                return;
            }

            if (newPass === currentPass) {
                status.textContent = "رمز جدید نمی‌تواند با رمز فعلی یکی باشد.";
                status.style.color = "var(--danger)";
                return;
            }

            btn.disabled = true;
            status.textContent = "در حال بررسی...";

            try {
                const { data, error: authError } = await db.auth.signInWithPassword({
                    email: currentUser.email,
                    password: currentPass
                });

                if (authError || data.user.id !== currentUser.id) {
                    status.textContent = "رمز فعلی اشتباه است.";
                    status.style.color = "var(--danger)";
                    return;
                }

                const { error: updateError } = await db.auth.updateUser({ password: newPass });

                if (updateError) {
                    status.textContent = "خطا در بروزرسانی: " + updateError.message;
                    status.style.color = "var(--danger)";
                } else {
                    status.textContent = "✅ رمز عبور با موفقیت تغییر یافت.";
                    status.style.color = "var(--success)";
                    document.getElementById("current-password").value = "";
                    document.getElementById("new-password").value = "";
                    document.getElementById("confirm-password").value = "";
                }
            } catch (err) {
                status.textContent = "خطای غیرمنتظره رخ داد.";
                status.style.color = "var(--danger)";
            } finally {
                btn.disabled = false;
            }
        }

        async function handleLogout() {
            await db.auth.signOut();
            currentUser = null;
            isAdmin = false;
            
            // پاکسازی فیلدها
            document.getElementById("login-user").value = "";
            document.getElementById("login-pass").value = "";
            document.getElementById("current-password").value = "";
            document.getElementById("new-password").value = "";
            document.getElementById("confirm-password").value = "";
            document.getElementById("password-change-status").textContent = "";
            document.getElementById("password-details").open = false;

            document.getElementById("login-card").classList.remove("hidden");
            document.getElementById("dashboard").classList.add("hidden");
        }

        async function loadCharges() {
            const container = document.getElementById("charges-container");
            container.innerHTML = "در حال دریافت اطلاعات...";

            let query = db.from("charges").select("*").order("created_at", { ascending: false });

            if (!isAdmin) {
                const unitNumber = parseInt(currentUser.email.replace(/[^0-9]/g, ""), 10);
                query = query.eq("unit_number", unitNumber);
            }

            const { data, error } = await query;

            if (error) {
                container.innerHTML = "خطا در دریافت اطلاعات: " + error.message;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = "هیچ صورتحسابی یافت نشد.";
                return;
            }

            container.innerHTML = "";
            data.forEach(item => {
                const div = document.createElement("div");
                div.className = "charge-item";
                
                const statusBadge = item.is_paid 
                    ? '<span class="badge badge-paid">پرداخت شده</span>' 
                    : '<span class="badge badge-pending">در انتظار پرداخت</span>';

                let receiptHtml = "";
                if (item.receipt_image_url) {
                    receiptHtml = `<br><a href="${item.receipt_image_url}" target="_blank" style="font-size: 0.8rem; color: var(--primary);">مشاهده تصویر فیش</a>`;
                }

                let actionHtml = "";
                if (isAdmin && !item.is_paid) {
                    actionHtml = `<button style="margin-top:10px; width:auto; padding: 6px 12px; background: var(--success);" onclick="confirmPayment(${item.id})">تأیید پرداخت</button>`;
                } else if (!isAdmin && !item.is_paid) {
                    actionHtml = `
                        <div style="margin-top:10px; background: #f1f5f9; padding: 10px; border-radius: 6px;">
                            <label style="font-size: 0.8rem;">کد پیگیری و تصویر فیش را وارد کنید:</label>
                            <input type="text" id="track-${item.id}" placeholder="کد پیگیری" style="margin-bottom:5px; height: 35px;">
                            <input type="file" id="file-${item.id}" accept="image/*" style="margin-bottom:5px; font-size: 0.8rem;">
                            <button style="padding: 6px 12px;" onclick="submitReceipt(${item.id})">ارسال رسید</button>
                        </div>
                    `;
                }

                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <strong>واحد ${item.unit_number} - ${item.month_name}</strong>
                            <div style="font-size: 1.1rem; color: var(--primary); font-weight: bold; margin: 4px 0;">${item.amount_due.toLocaleString()} تومان</div>
                            <div style="font-size: 0.85rem; color: #64748b;">${item.description || ''}</div>
                            ${item.receipt_tracking_code ? `<div style="font-size: 0.8rem; margin-top:5px;">کد پیگیری: ${item.receipt_tracking_code}</div>` : ''}
                            ${receiptHtml}
                        </div>
                        <div style="text-align: left;">
                            ${statusBadge}
                        </div>
                    </div>
                    ${actionHtml}
                `;
                container.appendChild(div);
            });
        }

        async function createCharge() {
            const unit = parseInt(document.getElementById("new-charge-unit").value);
            const month = document.getElementById("new-charge-month").value.trim();
            const amount = parseFloat(document.getElementById("new-charge-amount").value);
            const desc = document.getElementById("new-charge-desc").value.trim();

            if (!unit || !month || !amount) {
                alert("لطفاً شماره واحد، ماه و مبلغ را وارد کنید.");
                return;
            }

            const { error } = await db.from("charges").insert([
                { unit_number: unit, month_name: month, amount_due: amount, description: desc, is_paid: false }
            ]);

            if (error) {
                alert("خطا در ثبت: " + error.message);
            } else {
                alert("صورتحساب با موفقیت ثبت شد.");
                document.getElementById("new-charge-unit").value = "";
                document.getElementById("new-charge-month").value = "";
                document.getElementById("new-charge-amount").value = "";
                document.getElementById("new-charge-desc").value = "";
                loadCharges();
            }
        }

        async function submitReceipt(chargeId) {
            const trackCode = document.getElementById(`track-${chargeId}`).value.trim();
            const fileInput = document.getElementById(`file-${chargeId}`);
            const file = fileInput.files[0];

            if (!trackCode) {
                alert("لطفاً کد پیگیری را وارد کنید.");
                return;
            }

            let publicUrl = null;
            if (file) {
                const fileName = `${Date.now()}_${file.name}`;
                const { data: uploadData, error: uploadError } = await db.storage
                    .from('receipts')
                    .upload(fileName, file);

                if (uploadError) {
                    alert("خطا در بارگذاری تصویر: " + uploadError.message);
                    return;
                }

                const { data: urlData } = db.storage
                    .from('receipts')
                    .getPublicUrl(fileName);
                
                publicUrl = urlData.publicUrl;
            }

            const { error } = await db.from("charges")
                .update({ 
                    receipt_tracking_code: trackCode, 
                    receipt_image_url: publicUrl 
                })
                .eq("id", chargeId);

            if (error) {
                alert("خطا در ثبت رسید: " + error.message);
            } else {
                alert("رسید با موفقیت ارسال شد و در انتظار تأیید مدیر است.");
                loadCharges();
            }
        }

        async function confirmPayment(chargeId) {
            if (!confirm("آیا پرداخت این صورتحساب را تأیید می‌کنید؟")) return;

            const { error } = await db.from("charges")
                .update({ is_paid: true })
                .eq("id", chargeId);

            if (error) {
                alert("خطا: " + error.message);
            } else {
                loadCharges();
            }
        }
    </script>
</body>
</html>
