<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه مدیریت شارژ ساختمان</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 1.5rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        h1, h2 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            margin-top: 0.5rem;
        }

        button.outline:hover {
            background-color: #eff6ff;
        }

        .hidden {
            display: none !important;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-paid { background: #dcfce7; color: var(--success); }
        .badge-unpaid { background: #fee2e2; color: var(--danger); }

        .charge-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #fff;
        }

        .receipt-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: underline;
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- بخش لاگین -->
    <div id="login-card" class="card">
        <h1>ورود به سامانه شارژ ساختمان</h1>
        <div class="form-group">
            <label for="login-user">شماره واحد (یا نام کاربری مدیر)</label>
            <input type="text" id="login-user" placeholder="مثلاً: 1 یا admin">
        </div>
        <div class="form-group">
            <label for="login-pass">رمز عبور</label>
            <input type="password" id="login-pass">
        </div>
        <button onclick="handleLogin()">ورود</button>
    </div>

    <!-- داشبورد اصلی بعد از لاگین -->
    <div id="dashboard" class="hidden">
        <div class="header-bar">
            <div>
                <h2 id="user-display-title">داشبورد</h2>
                <span id="user-role-badge" class="badge"></span>
            </div>
            <div style="width: auto;">
                <button class="outline" style="width: auto; padding: 0.4rem 1rem;" onclick="handleLogout()">خروج</button>
            </div>
        </div>

        <!-- پنل ثبت شارژ جدید فقط مخصوص مدیر -->
        <div id="admin-create-charge" class="card hidden">
            <h2>ثبت شارژ جدید برای واحدها</h2>
            <div class="form-group">
                <label for="new-charge-unit">شماره واحد (۱ تا ۱۶):</label>
                <input type="number" id="new-charge-unit" min="1" max="16" placeholder="شماره واحد">
            </div>
            <div class="form-group">
                <label for="new-charge-month">نام دوره / ماه:</label>
                <input type="text" id="new-charge-month" placeholder="مثلاً: آبان ۱۴۰۳">
            </div>
            <div class="form-group">
                <label for="new-charge-amount">مبلغ شارژ (تومان):</label>
                <input type="number" id="new-charge-amount" placeholder="مثلاً: 350000">
            </div>
            <div class="form-group">
                <label for="new-charge-desc">توضیحات (اختیاری):</label>
                <textarea id="new-charge-desc" rows="2" placeholder="شارژ عادی، تعمیر آسانسور و ..."></textarea>
            </div>
            <button onclick="createCharge()">ثبت صورتحساب</button>
        </div>

        <!-- لیست شارژها -->
        <div class="card">
            <h2>لیست صورتحساب‌ها</h2>
            <div id="charges-container">در حال دریافت اطلاعات...</div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://virkprhykbvcawaryrvp.supabase.co";
    const SUPABASE_KEY = "GAPGPTMASKTOKENt4927pv3psX0X";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let isAdmin = false;

    // بررسی ورود اولیه
    window.addEventListener("DOMContentLoaded", async () => {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            setupUserSession(session.user);
        }
    });

    async function handleLogin() {
        const userInput = document.getElementById("login-user").value.trim().toLowerCase();
        const password = document.getElementById("login-pass").value;

        if (!userInput || !password) {
            alert("لطفاً نام کاربری و رمز عبور را وارد کنید.");
            return;
        }

        let email = "";
        if (userInput === "admin") {
            email = "admin@sakhteman.local";
        } else {
            const unitNumber = userInput.replace(/[^0-9]/g, "");
            email = "unit" + unitNumber + "@sakhteman.local";
        }

        const { data, error } = await db.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert("نام کاربری یا رمز عبور اشتباه است: " + error.message);
            return;
        }

        setupUserSession(data.user);
    }

    async function setupUserSession(user) {
        currentUser = user;
        isAdmin = user.email === "admin@sakhteman.local";

        document.getElementById("login-card").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");

        const roleBadge = document.getElementById("user-role-badge");
        const title = document.getElementById("user-display-title");

        if (isAdmin) {
            title.textContent = "پنل مدیریت ساختمان";
            roleBadge.textContent = "مدیر";
            roleBadge.className = "badge badge-paid";
            document.getElementById("admin-create-charge").classList.remove("hidden");
        } else {
            const unitNumber = user.email.replace(/[^0-9]/g, "");
            title.textContent = "واحد شماره " + unitNumber;
            roleBadge.textContent = "ساکن";
            roleBadge.className = "badge";
            roleBadge.style.background = "#e0e7ff";
            roleBadge.style.color = "#3730a3";
            document.getElementById("admin-create-charge").classList.add("hidden");
        }

        loadCharges();
    }

    async function handleLogout() {
        await db.auth.signOut();
        currentUser = null;
        isAdmin = false;
        document.getElementById("login-card").classList.remove("hidden");
        document.getElementById("dashboard").classList.add("hidden");
    }

    async function loadCharges() {
        const container = document.getElementById("charges-container");
        container.innerHTML = "در حال دریافت اطلاعات...";

        let query = db.from("charges").select("*").order("created_at", { ascending: false });

        if (!isAdmin) {
            const unitNumber = parseInt(currentUser.email.replace(/[^0-9]/g, ""), 10);
            query = query.eq("unit_number", unitNumber);
        }

        const { data, error } = await query;

        if (error) {
            container.innerHTML = "خطا در بارگذاری اطلاعات: " + error.message;
            return;
        }

        if (!data || data.length === 0) {
            container.innerHTML = "<p>هیچ صورتحسابی یافت نشد.</p>";
            return;
        }

        container.innerHTML = "";
        data.forEach(item => {
            const div = document.createElement("div");
            div.className = "charge-item";

            const statusBadge = item.is_paid
                ? `<span class="badge badge-paid">پرداخت شده</span>`
                : `<span class="badge badge-unpaid">پرداخت نشده</span>`;

            let receiptHtml = "";
            if (item.receipt_image_url) {
                receiptHtml = `<br><a class="receipt-link" href="${item.receipt_image_url}" target="_blank">مشاهده فیش واریزی</a>`;
            }

            let actionHtml = "";
            if (isAdmin && !item.is_paid) {
                actionHtml = `
                    <div style="margin-top: 10px;">
                        <button style="width: auto; padding: 0.4rem 0.8rem; background: var(--success);" onclick="confirmPayment(${item.id})">تأیید پرداخت</button>
                    </div>
                `;
            } else if (!isAdmin && !item.is_paid) {
                actionHtml = `
                    <div style="margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px;">
                        <label style="font-size: 0.8rem;">ارسال تصویر فیش یا کد رهگیری:</label>
                        <input type="text" id="track-${item.id}" placeholder="کد رهگیری بانکی" style="margin-bottom: 5px;">
                        <input type="file" id="file-${item.id}" accept="image/*" style="margin-bottom: 5px;">
                        <button style="width: auto; padding: 0.4rem 0.8rem;" onclick="submitReceipt(${item.id})">ارسال رسید</button>
                    </div>
                `;
            }

            div.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <strong>واحد ${item.unit_number} - دوره: ${item.month_name}</strong>
                    ${statusBadge}
                </div>
                <div>مبلغ: <strong>${Number(item.amount_due).toLocaleString("fa-IR")} تومان</strong></div>
                ${item.description ? `<div style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">توضیحات: ${item.description}</div>` : ""}
                ${item.receipt_tracking_code ? `<div style="font-size: 0.85rem; margin-top: 4px;">کد پیگیری: ${item.receipt_tracking_code}</div>` : ""}
                ${receiptHtml}
                ${actionHtml}
            `;

            container.appendChild(div);
        });
    }

    async function createCharge() {
        const unit = document.getElementById("new-charge-unit").value;
        const month = document.getElementById("new-charge-month").value;
        const amount = document.getElementById("new-charge-amount").value;
        const desc = document.getElementById("new-charge-desc").value;

        if (!unit || !month || !amount) {
            alert("لطفاً شماره واحد، دوره و مبلغ را وارد کنید.");
            return;
        }

        const { error } = await db.from("charges").insert([
            {
                unit_number: parseInt(unit, 10),
                month_name: month,
                amount_due: parseFloat(amount),
                description: desc,
                is_paid: false
            }
        ]);

        if (error) {
            alert("خطا در ثبت: " + error.message);
        } else {
            alert("صورتحساب با موفقیت ثبت شد.");
            document.getElementById("new-charge-month").value = "";
            document.getElementById("new-charge-amount").value = "";
            document.getElementById("new-charge-desc").value = "";
            loadCharges();
        }
    }

    async function submitReceipt(chargeId) {
        const trackCode = document.getElementById(`track-${chargeId}`).value;
        const fileInput = document.getElementById(`file-${chargeId}`);
        const file = fileInput.files[0];

        if (!trackCode && !file) {
            alert("لطفاً حداقل کد پیگیری یا تصویر رسید را وارد کنید.");
            return;
        }

        let imageUrl = null;

        if (file) {
            const fileName = `${Date.now()}_${file.name}`;
            const { data: uploadData, error: uploadError } = await db.storage
                .from("receipts")
                .upload(fileName, file);

            if (uploadError) {
                alert("خطا در آپلود عکس فیش: " + uploadError.message);
                return;
            }

            const { data: publicData } = db.storage
                .from("receipts")
                .getPublicUrl(fileName);

            imageUrl = publicData.publicUrl;
        }

        const updateData = {};
        if (trackCode) updateData.receipt_tracking_code = trackCode;
        if (imageUrl) updateData.receipt_image_url = imageUrl;

        const { error } = await db.from("charges")
            .update(updateData)
            .eq("id", chargeId);

        if (error) {
            alert("خطا در ذخیره رسید: " + error.message);
        } else {
            alert("رسید با موفقیت ارسال شد و در انتظار تایید مدیر است.");
            loadCharges();
        }
    }

    async function confirmPayment(chargeId) {
        const { error } = await db.from("charges")
            .update({ is_paid: true })
            .eq("id", chargeId);

        if (error) {
            alert("خطا در تایید پرداخت: " + error.message);
        } else {
            alert("پرداخت با موفقیت تایید شد.");
            loadCharges();
        }
    }
</script>

</body>
</html>
