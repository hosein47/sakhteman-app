<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه مدیریت ساختمان</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Vazirmatn, sans-serif;
            background: #f1f5f9;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body class="min-h-screen">

<header class="bg-blue-700 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="font-bold text-lg">سامانه مدیریت ساختمان</h1>

        <div id="user-area" class="hidden flex items-center gap-3">
            <span id="user-display"></span>
            <button onclick="logout()"
                    class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm">
                خروج
            </button>
        </div>
    </div>
</header>

<main class="max-w-6xl mx-auto p-4">

    <!-- Login -->
    <section id="login-section" class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold text-center mb-5">ورود به سامانه</h2>

        <form id="login-form" onsubmit="login(event)">
            <label class="block mb-2">نام کاربری</label>
            <input id="username"
                   type="text"
                   placeholder="مثلاً unit1 یا admin"
                   required
                   class="w-full border rounded p-3 mb-4">

            <label class="block mb-2">رمز عبور</label>
            <input id="password"
                   type="password"
                   required
                   class="w-full border rounded p-3 mb-4">

            <button id="login-button"
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded">
                ورود
            </button>

            <p id="login-message" class="text-red-600 text-sm mt-4 text-center"></p>
        </form>
    </section>

    <!-- Unit Dashboard -->
    <section id="unit-section" class="hidden">
        <div class="bg-white rounded-lg shadow p-5 mb-5">
            <div class="flex justify-between items-center gap-3 flex-wrap">
                <div>
                    <h2 class="text-xl font-bold">
                        داشبورد واحد <span id="welcome-unit"></span>
                    </h2>
                    <p class="text-gray-500 text-sm mt-1">
                        در صورت پرداخت، کد پیگیری یا تصویر فیش را ثبت کنید.
                    </p>
                </div>

                <button onclick="loadUnitCharges()"
                        class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded">
                    به‌روزرسانی
                </button>
            </div>
        </div>

        <div id="unit-message" class="mb-4"></div>
        <div id="charges-list" class="space-y-4"></div>
    </section>

    <!-- Admin Dashboard -->
    <section id="admin-section" class="hidden">

        <div class="flex justify-between items-center gap-3 flex-wrap mb-5">
            <h2 class="text-xl font-bold">پنل مدیریت</h2>

            <button onclick="loadAdminCharges()"
                    class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded">
                به‌روزرسانی
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white rounded-lg shadow p-5">
                <p class="text-gray-500">تعداد کل قبض‌ها</p>
                <p id="stat-total" class="text-3xl font-bold mt-2">۰</p>
            </div>

            <div class="bg-white rounded-lg shadow p-5">
                <p class="text-gray-500">پرداخت‌شده</p>
                <p id="stat-paid" class="text-3xl font-bold text-green-600 mt-2">۰</p>
            </div>

            <div class="bg-white rounded-lg shadow p-5">
                <p class="text-gray-500">پرداخت‌نشده</p>
                <p id="stat-unpaid" class="text-3xl font-bold text-red-600 mt-2">۰</p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-5 mb-6">
            <h3 class="font-bold text-lg mb-4">صدور شارژ برای همه واحدها</h3>

            <form onsubmit="createBatchCharge(event)"
                  class="grid grid-cols-1 md:grid-cols-4 gap-3">

                <input id="batch-month"
                       type="text"
                       placeholder="ماه، مثلاً آبان ۱۴۰۵"
                       required
                       class="border rounded p-3">

                <input id="batch-amount"
                       type="number"
                       placeholder="مبلغ"
                       required
                       class="border rounded p-3">

                <input id="batch-description"
                       type="text"
                       placeholder="توضیحات"
                       class="border rounded p-3">

                <button id="batch-button"
                        type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white rounded p-3">
                    صدور برای ۱۶ واحد
                </button>
            </form>

            <p id="batch-message" class="text-sm mt-3"></p>
        </div>

        <div class="bg-white rounded-lg shadow p-5">
            <h3 class="font-bold text-lg mb-4">لیست شارژها و فیش‌های پرداختی</h3>
            <div id="admin-charges-list" class="overflow-x-auto"></div>
        </div>
    </section>
</main>

<script>
    const SUPABASE_URL = "https://virkprhykbvcawaryrvp.supabase.co";

    // کلید anon فعلی فایل قبلی خودتان را در این قسمت قرار دهید
    const SUPABASE_ANON_KEY = "کلید_anon_فعلی_خودتان";

    const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    let currentSession = null;
    let currentCharges = [];

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatMoney(value) {
        return Number(value || 0).toLocaleString("fa-IR") + " تومان";
    }

    function showOnly(sectionId) {
        document.querySelectorAll("main > section").forEach(section => {
            section.classList.add("hidden");
        });

        document.getElementById(sectionId).classList.remove("hidden");
    }

    function setMessage(elementId, text, type = "error") {
        const element = document.getElementById(elementId);

        element.textContent = text;
        element.className =
            type === "success"
                ? "text-green-600 text-sm mt-3"
                : "text-red-600 text-sm mt-3";
    }

    async function login(event) {
        event.preventDefault();

        const username = document.getElementById("username")
            .value.trim()
            .toLowerCase();

        const password = document.getElementById("password").value;
        const loginButton = document.getElementById("login-button");

        let email = "";

        if (username === "admin") {
            email = "admin@sakhteman.local";
        } else if (/^unit([1-9]|1[0-6])$/.test(username)) {
            email = username + "@sakhteman.local";
        } else {
            setMessage("login-message", "نام کاربری معتبر نیست.");
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "در حال ورود...";

        const { data, error } = await db.auth.signInWithPassword({
            email: email,
            password: password
        });

        loginButton.disabled = false;
        loginButton.textContent = "ورود";

        if (error) {
            setMessage("login-message", "نام کاربری یا رمز عبور اشتباه است.");
            return;
        }

        await openDashboard(data.session);
    }

    async function openDashboard(session) {
        currentSession = session;

        const email = session.user.email || "";
        const isAdmin = email === "admin@sakhteman.local";

        document.getElementById("user-area").classList.remove("hidden");
        document.getElementById("user-display").textContent =
            isAdmin ? "مدیر ساختمان" : email.split("@")[0];

        document.getElementById("login-section").classList.add("hidden");

        if (isAdmin) {
            showOnly("admin-section");
            await loadAdminCharges();
        } else {
            const unitNumber = email.match(/^unit(\d+)@/)[1];

            document.getElementById("welcome-unit").textContent =
                "شماره " + Number(unitNumber).toLocaleString("fa-IR");

            showOnly("unit-section");
            await loadUnitCharges();
        }
    }

    async function logout() {
        await db.auth.signOut();

        currentSession = null;
        currentCharges = [];

        document.getElementById("user-area").classList.add("hidden");
        document.getElementById("login-section").classList.remove("hidden");
        document.getElementById("unit-section").classList.add("hidden");
        document.getElementById("admin-section").classList.add("hidden");

        document.getElementById("password").value = "";
    }

    async function loadUnitCharges() {
        const list = document.getElementById("charges-list");
        list.innerHTML = "<p class='text-gray-500'>در حال دریافت اطلاعات...</p>";

        const { data, error } = await db
            .from("charges")
            .select(`
                id,
                unit_number,
                month_name,
                amount_due,
                amount_paid,
                is_paid,
                description,
                receipt_tracking_code,
                receipt_image_url
            `)
            .order("id", { ascending: false });

        if (error) {
            list.innerHTML =
                "<p class='text-red-600'>خطا در دریافت شارژها: " +
                escapeHtml(error.message) +
                "</p>";
            return;
        }

        currentCharges = data || [];

        if (currentCharges.length === 0) {
            list.innerHTML =
                "<div class='bg-white rounded-lg shadow p-6 text-center text-gray-500'>" +
                "هنوز شارژی برای این واحد ثبت نشده است." +
                "</div>";
            return;
        }

        list.innerHTML = currentCharges.map(charge => {
            const paid = charge.is_paid === true;
            const oldTracking = charge.receipt_tracking_code || "";
            const oldImage = charge.receipt_image_url || "";

            return `
                <div class="bg-white rounded-lg shadow p-5">
                    <div class="flex justify-between gap-3 flex-wrap mb-4">
                        <div>
                            <h3 class="font-bold text-lg">
                                شارژ ${escapeHtml(charge.month_name)}
                            </h3>
                            <p class="text-gray-600 mt-1">
                                مبلغ: ${formatMoney(charge.amount_due)}
                            </p>
                            ${
                                charge.description
                                    ? `<p class="text-gray-500 text-sm mt-1">
                                        ${escapeHtml(charge.description)}
                                       </p>`
                                    : ""
                            }
                        </div>

                        <span class="${
                            paid
                                ? "bg-green-100 text-green-700"
                                : "bg-red-100 text-red-700"
                        } px-3 py-2 rounded h-fit text-sm">
                            ${paid ? "پرداخت شده" : "پرداخت نشده"}
                        </span>
                    </div>

                    ${
                        oldTracking || oldImage
                            ? `
                            <div class="border-t pt-3 mb-4 text-sm">
                                <p class="font-bold mb-2">اطلاعات فیش ثبت‌شده:</p>
                                ${
                                    oldTracking
                                        ? `<p>کد پیگیری:
                                            <span class="text-blue-700">
                                            ${escapeHtml(oldTracking)}
                                            </span>
                                           </p>`
                                        : ""
                                }
                                ${
                                    oldImage
                                        ? `<a href="${escapeHtml(oldImage)}"
                                             target="_blank"
                                             class="inline-block text-blue-600 hover:underline mt-2">
                                             مشاهده تصویر فیش
                                           </a>`
                                        : ""
                                }
                            </div>
                            `
                            : ""
                    }

                    <form onsubmit="submitReceipt(event, ${charge.id})"
                          class="border-t pt-4">

                        <p class="font-bold mb-3">
                            ${oldTracking || oldImage
                                ? "ویرایش اطلاعات فیش"
                                : "ثبت فیش پرداخت"}
                        </p>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <input id="tracking-${charge.id}"
                                   type="text"
                                   value="${escapeHtml(oldTracking)}"
                                   placeholder="کد پیگیری"
                                   class="border rounded p-3">

                            <input id="file-${charge.id}"
                                   type="file"
                                   accept="image/*"
                                   class="border rounded p-3">

                            <button id="receipt-button-${charge.id}"
                                    type="submit"
                                    class="bg-green-600 hover:bg-green-700 text-white rounded p-3">
                                ارسال فیش
                            </button>
                        </div>

                        <p class="text-gray-500 text-xs mt-2">
                            حداکثر حجم تصویر: ۵ مگابایت
                        </p>

                        <p id="receipt-message-${charge.id}"
                           class="text-sm mt-3"></p>
                    </form>
                </div>
            `;
        }).join("");
    }

    async function submitReceipt(event, chargeId) {
        event.preventDefault();

        const trackingInput = document.getElementById("tracking-" + chargeId);
        const fileInput = document.getElementById("file-" + chargeId);
        const button = document.getElementById("receipt-button-" + chargeId);
        const messageId = "receipt-message-" + chargeId;

        const trackingCode = trackingInput.value.trim();
        const file = fileInput.files[0];

        const oldCharge = currentCharges.find(
            charge => String(charge.id) === String(chargeId)
        );

        if (!trackingCode && !file && !oldCharge?.receipt_image_url) {
            setMessage(
                messageId,
                "لطفاً کد پیگیری یا تصویر فیش را وارد کنید."
            );
            return;
        }

        if (file && file.size > 5 * 1024 * 1024) {
            setMessage(messageId, "حجم تصویر نباید بیشتر از ۵ مگابایت باشد.");
            return;
        }

        button.disabled = true;
        button.textContent = "در حال ارسال...";

        let imageUrl = oldCharge?.receipt_image_url || null;
        let uploadedPath = null;

        try {
            if (file) {
                const extension =
                    (file.name.split(".").pop() || "jpg")
                    .toLowerCase()
                    .replace(/[^a-z0-9]/g, "");

                uploadedPath =
                    currentSession.user.id +
                    "/" +
                    chargeId +
                    "-" +
                    Date.now() +
                    "." +
                    extension;

                const uploadResult = await db.storage
                    .from("receipts")
                    .upload(uploadedPath, file, {
                        contentType: file.type || "image/jpeg",
                        upsert: false
                    });

                if (uploadResult.error) {
                    throw uploadResult.error;
                }

                const publicResult = db.storage
                    .from("receipts")
                    .getPublicUrl(uploadedPath);

                imageUrl = publicResult.data.publicUrl;
            }

            const { error: updateError } = await db
                .from("charges")
                .update({
                    receipt_tracking_code:
                        trackingCode ||
                        oldCharge?.receipt_tracking_code ||
                        null,
                    receipt_image_url: imageUrl
                })
                .eq("id", chargeId);

            if (updateError) {
                if (uploadedPath) {
                    await db.storage
                        .from("receipts")
                        .remove([uploadedPath]);
                }

                throw updateError;
            }

            setMessage(messageId, "فیش با موفقیت ثبت شد.", "success");
            await loadUnitCharges();

        } catch (error) {
            setMessage(
                messageId,
                "خطا در ثبت فیش: " + error.message
            );

        } finally {
            button.disabled = false;
            button.textContent = "ارسال فیش";
        }
    }

    async function loadAdminCharges() {
        const list = document.getElementById("admin-charges-list");

        list.innerHTML =
            "<p class='text-gray-500'>در حال دریافت اطلاعات...</p>";

        const { data, error } = await db
            .from("charges")
            .select(`
                id,
                unit_number,
                month_name,
                amount_due,
                amount_paid,
                is_paid,
                description,
                receipt_tracking_code,
                receipt_image_url
            `)
            .order("unit_number", { ascending: true })
            .order("id", { ascending: false });

        if (error) {
            list.innerHTML =
                "<p class='text-red-600'>خطا: " +
                escapeHtml(error.message) +
                "</p>";
            return;
        }

        currentCharges = data || [];

        const paidCount = currentCharges.filter(
            charge => charge.is_paid === true
        ).length;

        document.getElementById("stat-total").textContent =
            currentCharges.length.toLocaleString("fa-IR");

        document.getElementById("stat-paid").textContent =
            paidCount.toLocaleString("fa-IR");

        document.getElementById("stat-unpaid").textContent =
            (currentCharges.length - paidCount).toLocaleString("fa-IR");

        if (currentCharges.length === 0) {
            list.innerHTML =
                "<p class='text-gray-500'>هنوز هیچ شارژی ثبت نشده است.</p>";
            return;
        }

        list.innerHTML = `
            <table class="w-full text-sm border-collapse">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="border p-3">واحد</th>
                        <th class="border p-3">ماه</th>
                        <th class="border p-3">مبلغ</th>
                        <th class="border p-3">کد پیگیری</th>
                        <th class="border p-3">تصویر فیش</th>
                        <th class="border p-3">وضعیت</th>
                        <th class="border p-3">عملیات</th>
                    </tr>
                </thead>

                <tbody>
                    ${currentCharges.map(charge => `
                        <tr>
                            <td class="border p-3 text-center">
                                ${Number(charge.unit_number).toLocaleString("fa-IR")}
                            </td>

                            <td class="border p-3">
                                ${escapeHtml(charge.month_name)}
                            </td>

                            <td class="border p-3">
                                ${formatMoney(charge.amount_due)}
                            </td>

                            <td class="border p-3">
                                ${
                                    charge.receipt_tracking_code
                                        ? escapeHtml(charge.receipt_tracking_code)
                                        : "<span class='text-gray-400'>ثبت نشده</span>"
                                }
                            </td>

                            <td class="border p-3 text-center">
                                ${
                                    charge.receipt_image_url
                                        ? `<a href="${escapeHtml(charge.receipt_image_url)}"
                                             target="_blank"
                                             class="text-blue-600 hover:underline">
                                             مشاهده فیش
                                           </a>`
                                        : "<span class='text-gray-400'>ندارد</span>"
                                }
                            </td>

                            <td class="border p-3 text-center">
                                <span class="${
                                    charge.is_paid
                                        ? "text-green-600"
                                        : "text-red-600"
                                }">
                                    ${charge.is_paid
                                        ? "پرداخت شده"
                                        : "پرداخت نشده"}
                                </span>
                            </td>

                            <td class="border p-3 text-center">
                                <button
                                    onclick="togglePaid(${charge.id}, ${!charge.is_paid})"
                                    class="${
                                        charge.is_paid
                                            ? "bg-red-500 hover:bg-red-600"
                                            : "bg-green-600 hover:bg-green-700"
                                    } text-white px-3 py-2 rounded text-xs">
                                    ${
                                        charge.is_paid
                                            ? "ثبت به‌عنوان پرداخت‌نشده"
                                            : "تأیید پرداخت"
                                    }
                                </button>
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        `;
    }

    async function togglePaid(chargeId, newStatus) {
        const { error } = await db
            .from("charges")
            .update({
                is_paid: newStatus,
                amount_paid: newStatus
                    ? currentCharges.find(c => c.id === chargeId)?.amount_due || 0
                    : 0
            })
            .eq("id", chargeId);

        if (error) {
            alert("خطا در تغییر وضعیت: " + error.message);
            return;
        }

        await loadAdminCharges();
    }

    async function createBatchCharge(event) {
        event.preventDefault();

        const monthName = document.getElementById("batch-month").value.trim();
        const amount = Number(document.getElementById("batch-amount").value);
        const description = document.getElementById("batch-description").value.trim();
        const button = document.getElementById("batch-button");

        if (!monthName || !amount || amount <= 0) {
            setMessage("batch-message", "ماه و مبلغ را صحیح وارد کنید.");
            return;
        }

        button.disabled = true;
        button.textContent = "در حال ثبت...";

        const rows = [];

        for (let unit = 1; unit <= 16; unit++) {
            rows.push({
                unit_number: unit,
                month_name: monthName,
                amount_due: amount,
                amount_paid: 0,
                is_paid: false,
                description: description || null
            });
        }

        const { error } = await db
            .from("charges")
            .insert(rows);

        button.disabled = false;
        button.textContent = "صدور برای ۱۶ واحد";

        if (error) {
            setMessage(
                "batch-message",
                "خطا در ثبت شارژ: " + error.message
            );
            return;
        }

        setMessage(
            "batch-message",
            "شارژ برای هر ۱۶ واحد با موفقیت ثبت شد.",
            "success"
        );

        document.getElementById("batch-month").value = "";
        document.getElementById("batch-amount").value = "";
        document.getElementById("batch-description").value = "";

        await loadAdminCharges();
    }

    db.auth.getSession().then(async result => {
        if (result.data.session) {
            await openDashboard(result.data.session);
        }
    });

    db.auth.onAuthStateChange((event, session) => {
        if (event === "SIGNED_OUT") {
            currentSession = null;
        } else if (session) {
            setTimeout(() => openDashboard(session), 0);
        }
    });
</script>

</body>
</html>
