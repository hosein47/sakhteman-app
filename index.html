<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه مدیریت ساختمان</title>
    <!-- Tailwind CSS برای طراحی زیبا و واکنش‌گرا -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- کتابخانه Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div id="app" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-2">سامانه مدیریت ساختمان</h1>
        <p class="text-xs text-center text-slate-400 mb-6">جایگزین امن و راحت گروه‌های پیام‌رسان</p>

        <!-- فرم ورود -->
        <div id="login-section">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">نام کاربری واحد (مثلا unit1)</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="unit1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">رمز عبور</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="******" value="123456">
                </div>
                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl transition">ورود به سامانه</button>
                <p id="login-error" class="text-red-500 text-xs text-center mt-2"></p>
            </div>
        </div>

        <!-- پنل اصلی بعد از ورود -->
        <div id="dashboard-section" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-blue-50 p-3 rounded-xl border border-blue-100">
                <div>
                    <span id="user-unit-badge" class="font-bold text-blue-800 text-sm"></span>
                    <p class="text-xs text-blue-600">خوش آمدید</p>
                </div>
                <button onclick="logout()" class="text-xs bg-white text-red-600 px-3 py-1.5 rounded-lg border border-red-200 hover:bg-red-50">خروج</button>
            </div>

            <div class="space-y-3">
                <div class="p-4 bg-slate-50 rounded-xl border">
                    <h3 class="font-bold text-sm mb-2 text-slate-700">وضعیت شارژ و اطلاعیه‌ها</h3>
                    <p class="text-xs text-slate-500">به زودی بخش پرداخت شارژ و آپلود رسید فعال می‌شود.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // اطلاعات اتصال به Supabase شما
        const SUPABASE_URL = 'https://virkprhykbvcawaryrvp.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_V3f8YRCSNQNhH7yrFhaLCA_c-lm6Flj'; // کلیک کنید و کلید خود را قرار دهید
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function login() {
            const usernameInput = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            
            errorEl.textContent = '';
            if(!usernameInput) {
                errorEl.textContent = 'لطفا نام کاربری را وارد کنید';
                return;
            }

            // ایمیل فرضی برای سیستم اتومیشن واحدهای Supabase
            const email = `${usernameInput}@sakhteman.app`;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorEl.textContent = 'نام کاربری یا رمز عبور اشتباه است.';
            } else {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('user-unit-badge').textContent = usernameInput.toUpperCase();
            }
        }

        function logout() {
            supabaseClient.auth.signOut();
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
