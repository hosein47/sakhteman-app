<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت ساختمان Poonak 8</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #3b82f6; --primary-hover: #2563eb; --border: #e2e8f0; --text-main: #1e293b; --text-muted: #64748b; --danger: #ef4444; }
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.88rem; color: #334155; }
        input, select, textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.95rem; transition: all 0.2s ease; background-color: #fafafa; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background-color: #ffffff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        button { width: 100%; padding: 13px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2); }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3); }
        button:active { transform: translateY(0); }
        button.outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-muted); box-shadow: none; }
        button.outline:hover { background: #f8fafc; border-color: #cbd5e1; color: var(--text-main); }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; background: #e2e8f0; }
        .badge-paid { background: #dcfce7; color: #166534; }
        .status-msg { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 0.85rem; }
        .charge-item { border: 1px solid var(--border); padding: 16px; border-radius: 12px; margin-bottom: 12px; }
        .amount-highlight { font-weight: 700; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div id="login-card" class="card">
        <h2>ورود به پنل ساختمان</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>نام کاربری (شماره واحد):</label>
                <input type="text" id="login-user" required placeholder="مثلاً: 1">
            </div>
            <div class="form-group">
                <label>رمز عبور:</label>
                <input type="password" id="login-pass" required>
            </div>
            <button type="submit" id="login-btn">ورود</button>
        </form>
    </div>

    <div id="dashboard" class="hidden">
        <div class="card">
            <h2 id="user-display-title">پنل ساختمان</h2>
            <div id="user-role-badge" class="badge"></div>
            <button class="outline" style="margin-top: 15px;" onclick="handleLogout()">خروج از حساب</button>
        </div>

        <details id="password-details" class="password-section" style="margin-bottom: 20px;">
            <summary>🔐 تغییر رمز عبور حساب</summary>
            <div class="card" style="margin-top: 10px;">
                <div class="form-group">
                    <input type="password" id="current-password" placeholder="رمز عبور فعلی">
                </div>
                <div class="form-group">
                    <input type="password" id="new-password" placeholder="رمز عبور جدید">
                </div>
                <div class="form-group">
                    <input type="password" id="confirm-password" placeholder="تکرار رمز عبور جدید">
                </div>
                <button id="change-password-button" onclick="handleChangePassword()">ثبت رمز عبور جدید</button>
                <div id="password-change-status" class="status-msg"></div>
            </div>
        </details>

        <div id="admin-create-charge" class="card hidden" style="border-top: 4px solid var(--primary);">
            <h2>ثبت صورتحساب شارژ جدید</h2>
            <div class="form-group">
                <label for="new-charge-unit">انتخاب واحد:</label>
                <select id="new-charge-unit">
                    <option value="">-- انتخاب کنید --</option>
                    <option value="all_residents">📢 همه واحدهای ساکن (۱ تا ۸)</option>
                    <option value="1">واحد ۱</option>
                    <option value="2">واحد ۲</option>
                    <option value="3">واحد ۳</option>
                    <option value="4">واحد ۴</option>
                    <option value="5">واحد ۵</option>
                    <option value="6">واحد ۶</option>
                    <option value="7">واحد ۷</option>
                    <option value="8">واحد ۸</option>
                    <option value="9">واحد ۹</option>
                    <option value="10">واحد ۱۰</option>
                    <option value="11">واحد ۱۱</option>
                    <option value="12">واحد ۱۲</option>
                    <option value="13">واحد ۱۳</option>
                    <option value="14">واحد ۱۴</option>
                    <option value="15">واحد ۱۵</option>
                    <option value="16">واحد ۱۶</option>
                </select>
            </div>
            <div class="form-group">
                <label for="new-charge-month">نام دوره / ماه:</label>
                <input type="text" id="new-charge-month" placeholder="مثلاً: آبان ۱۴۰۳">
            </div>
            <div class="form-group">
                <label for="new-charge-amount">مبلغ شارژ (تومان):</label>
                <input type="number" id="new-charge-amount" placeholder="مثلاً: 350000">
            </div>
            <div class="form-group">
                <label for="new-charge-desc">توضیحات (اختیاری):</label>
                <textarea id="new-charge-desc" rows="2" placeholder="توضیحات لازم برای ساکنین..."></textarea>
            </div>
            <button onclick="createCharge()">ثبت صورتحساب</button>
        </div>

        <div id="charges-list-container">
            <h3>صورت‌حساب‌ها و وضعیت پرداخت</h3>
            <div id="charges-container"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://virkprhykbvcawaryrvp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_V3f8YRCSNQNhH7yrFhaLCA_c-lm6Flj"; 
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let isAdmin = false;

    async function handleLogin(e) {
        e.preventDefault();
        const unit = document.getElementById('login-user').value.trim();
        const pass = document.getElementById('login-pass').value.trim();
        const email = unit.includes('@') ? unit : `${unit}@sakhteman.local`;
        
        const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
        if (error) alert("خطا در ورود: " + error.message);
        else {
            currentUser = data.user;
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            setupUserSession(data.user);
        }
    }

    async function setupUserSession(user) {
        currentUser = user;
        isAdmin = user.email === "admin@sakhteman.local";
        const title = document.getElementById("user-display-title");
        const roleBadge = document.getElementById("user-role-badge");

        if (isAdmin) {
            title.textContent = "پنل مدیریت ساختمان";
            roleBadge.textContent = "مدیر ساختمان";
            roleBadge.className = "badge badge-paid";
            document.getElementById("admin-create-charge").classList.remove("hidden");
        } else {
            const unitNumber = user.email.replace(/[^0-9]/g, "");
            title.textContent = "واحد شماره " + unitNumber;
            roleBadge.textContent = "ساکن واحد " + unitNumber;
            roleBadge.className = "badge";
            document.getElementById("admin-create-charge").classList.add("hidden");
        }
        loadCharges();
    }

    async function handleChangePassword() {
        const cur = document.getElementById("current-password").value;
        const nPass = document.getElementById("new-password").value;
        const confirm = document.getElementById("confirm-password").value;
        const status = document.getElementById("password-change-status");

        if (nPass.length < 8) { status.textContent = "رمز عبور باید حداقل ۸ کاراکتر باشد."; return; }
        if (nPass !== confirm) { status.textContent = "رمزهای عبور مطابقت ندارند."; return; }

        const { error: reauthError } = await db.auth.signInWithPassword({ email: currentUser.email, password: cur });
        if (reauthError) { status.textContent = "رمز عبور فعلی صحیح نیست."; return; }

        const { error: updateError } = await db.auth.updateUser({ password: nPass });
        if (updateError) status.textContent = "خطا در ثبت: " + updateError.message;
        else { status.textContent = "✅ رمز عبور با موفقیت بروزرسانی شد."; document.getElementById("current-password").value = ""; document.getElementById("new-password").value = ""; document.getElementById("confirm-password").value = ""; }
    }

    function handleLogout() {
        db.auth.signOut();
        location.reload();
    }

    async function loadCharges() {
        const container = document.getElementById("charges-container");
        container.innerHTML = "در حال دریافت اطلاعات...";
        
        let query = db.from("charges").select("*").order("created_at", { ascending: false });
        if (!isAdmin) {
            const unitNumber = parseInt(currentUser.email.replace(/[^0-9]/g, ""));
            query = query.eq("unit_number", unitNumber);
        }

        const { data, error } = await query;
        if (error) { container.innerHTML = "خطا در دریافت اطلاعات."; return; }
        if (data.length === 0) { container.innerHTML = "صورت‌حسابی یافت نشد."; return; }

        container.innerHTML = "";
        data.forEach(c => {
            const div = document.createElement("div");
            div.className = "charge-item";
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <strong>${isAdmin ? 'واحد ' + c.unit_number + ' - ' : ''}دوره ${c.month_name}</strong>
                    <span class="badge ${c.is_paid ? 'badge-paid' : ''}">${c.is_paid ? 'پرداخت شده' : 'در انتظار پرداخت'}</span>
                </div>
                <p style="margin: 8px 0;">مبلغ: <span class="amount-highlight">${c.amount_due.toLocaleString()} تومان</span></p>
                ${c.description ? `<p style="font-size:0.9rem; color:#666;">${c.description}</p>` : ''}
                ${!c.is_paid ? `<button onclick="confirmPayment('${c.id}')" style="background:green; margin-top:10px;">ثبت پرداخت</button>` : ''}
            `;
            container.appendChild(div);
        });
    }

    async function createCharge() {
        const unitVal = document.getElementById("new-charge-unit").value;
        const month = document.getElementById("new-charge-month").value.trim();
        const amount = parseFloat(document.getElementById("new-charge-amount").value);
        const desc = document.getElementById("new-charge-desc").value.trim();

        if (!unitVal || !month || !amount || amount <= 0) {
            alert("لطفاً واحد، ماه و مبلغ معتبر را وارد کنید.");
            return;
        }

        let chargesToInsert = [];
        if (unitVal === "all_residents") {
            for (let i = 1; i <= 8; i++) {
                chargesToInsert.push({ unit_number: i, month_name: month, amount_due: amount, description: desc, is_paid: false });
            }
        } else {
            chargesToInsert.push({ unit_number: parseInt(unitVal), month_name: month, amount_due: amount, description: desc, is_paid: false });
        }

        const { error } = await db.from("charges").insert(chargesToInsert);
        if (error) {
            alert("خطا در ثبت: " + error.message);
        } else {
            alert(unitVal === "all_residents" ? "صورتحساب برای تمام واحدهای ۱ تا ۸ ثبت شد." : "صورتحساب با موفقیت ثبت شد.");
            document.getElementById("new-charge-unit").value = "";
            document.getElementById("new-charge-month").value = "";
            document.getElementById("new-charge-amount").value = "";
            document.getElementById("new-charge-desc").value = "";
            loadCharges();
        }
    }

    async function confirmPayment(id) {
        if (!confirm("آیا پرداخت این صورتحساب تایید می‌شود؟")) return;
        const { error } = await db.from("charges").update({ is_paid: true }).eq("id", id);
        if (error) alert("خطا: " + error.message);
        else { alert("پرداخت تایید شد."); loadCharges(); }
    }

    db.auth.getSession().then(({ data }) => {
        if (data.session) setupUserSession(data.session.user);
        else { document.getElementById('login-card').classList.remove('hidden'); document.getElementById('dashboard').classList.add('hidden'); }
    });
</script>
</body>
</html>
